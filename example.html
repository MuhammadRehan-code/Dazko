<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="DAZKO.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Transparent fixed navbar over hero */
        .navbar-fitness {
            background: transparent;
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
            transition: background-color 0.3s ease;
        }

        /* Brand styling */
        .brand-title {
            font-weight: 800;
            font-style: italic;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .brand-subtitle {
            font-size: 0.65rem;
            font-weight: 700;
            font-style: italic;
            color: #e11d38;
            letter-spacing: 1px;
            display: block;
        }

        /* Nav links */
        .navbar-fitness .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.5rem 0.9rem;
        }

        .navbar-fitness .nav-link:hover,
        .navbar-fitness .nav-link.active {
            color: #ffffff;
        }

        /* Slanted "BECOME A MEMBER" button */
        .btn-member {
            background-color: #e11d38;
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.85rem 1.75rem;
            border: none;
            border-radius: 2px;
            text-decoration: none;
            display: inline-block;
            transform: skewX(-18deg);
            transition: background-color 0.2s ease;
        }

        .btn-member:hover {
            background-color: #c4162e;
            color: #ffffff;
        }

        /* Un-skew the text inside the slanted button */
        .btn-member span {
            display: inline-block;
            transform: skewX(18deg);
        }

        /* Demo Hero Section */
        .hero-section {
            min-height: 100vh;
            background: linear-gradient(rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0.85)),
                url('https://unsplash.com') center/cover no-repeat;
            display: flex;
            align-items: center;
        }
    </style>

</head>

<body>

    <nav class="navbar lg:navbar-expand fixed-top navbar-fitness" data-bs-theme="dark">
        <div class="container">
            <!-- Brand Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <!-- Simple SVG Icon matching the dumbbell/bell mark -->
                <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://w3.org">
                    <path d="M6 20C6 13.3726 11.3726 8 18 8C24.6274 8 30 13.3726 30 20" stroke="#e11d38"
                        stroke-width="3" stroke-linecap="round" />
                    <path d="M10 20C10 15.5817 13.5817 12 18 12C22.4183 12 26 15.5817 26 20" stroke="#ffffff"
                        stroke-width="2.5" stroke-linecap="round" />
                    <rect x="4" y="21" width="28" height="4" rx="2" fill="#e11d38" />
                </svg>
                <div>
                    <div class="brand-title text-white">DAZKO</div>
                    <span class="brand-subtitle">STRENGTH &amp; FITNESS</span>
                </div>
            </a>

            <!-- Mobile Drawer Toggler -->
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#fitnessDrawer" aria-controls="fitnessDrawer" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <!-- Bootstrap 6 Dialog Drawer -->
            <dialog class="drawer drawer-end bg-dark text-white" tabindex="-1" id="fitnessDrawer"
                aria-labelledby="fitnessDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title fw-bold fst-italic" id="fitnessDrawerLabel">DAZKO</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body align-items-center">
                    <ul class="nav navbar-nav ms-auto me-lg-4 mb-3 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Trainers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Classes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Schedules</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">News</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                    <a href="#" class="btn-member">
                        <span>Become a Member</span>
                    </a>
                </div>
            </dialog>
        </div>
    </nav>

    <!-- Sample Hero Background to Demonstrate Transparency -->
    <section class="hero-section">
        <div class="container">
            <div>
                <img src="imgi_31_bg_3.jpeg" class="img-fluid">
                <h1 class="display-3 fw-black fst-italic text-uppercase">Shape Your<br>Perfect Body</h1>
                <p >A small river named Duben flows by their place and supplies it with <br>the necessary
                    regelialia
                </p>
            </div>
        </div>
    </section>





    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
